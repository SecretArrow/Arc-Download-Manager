name: Auto fix

# Runs ktlintFormat and pushes the result back to main so style issues self-heal.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  ktlint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlintFormat
        run: ./gradlew :app:ktlintFormat

      - name: Commit formatting fixes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(autofix): apply ktlint format [skip ci]'
          branch: main
          commit_user_name: arc-autofix-bot
          commit_user_email: autofix@arc.local
          skip_dirty_check: false
