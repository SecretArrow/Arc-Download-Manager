name: Release

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: 'Prefix for the release tag'
        required: false
        default: 'v'
        type: string
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (block token leaks)
        run: |
          if grep -RIEl "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}" --exclude-dir=.git . ; then
            echo "::error::Potential GitHub token found in tracked files"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag_prefix || 'v' }}${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.meta.outputs.exists == 'false'
        env:
          ARC_KEYSTORE_B64: ${{ secrets.ARC_KEYSTORE_B64 }}
        run: |
          echo "$ARC_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release APK
        if: steps.meta.outputs.exists == 'false'
        env:
          ARC_STORE_FILE: ${{ github.workspace }}/release.keystore
          ARC_STORE_PASSWORD: ${{ secrets.ARC_STORE_PASSWORD }}
          ARC_KEY_ALIAS: ${{ secrets.ARC_KEY_ALIAS }}
          ARC_KEY_PASSWORD: ${{ secrets.ARC_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Generate release notes
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV"..HEAD --pretty=format:"- %s (%h)" | head -50)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" | head -50)
          fi
          cat > release_notes.md <<NOTES
          ## Arc Download Manager ${{ steps.meta.outputs.version }}

          Signed release APK for Android 8.0+ (API 26+).

          ### Highlights
          - Multi-segment download engine with pause/resume
          - Integrated browser with session-aware (cookie-preserving) downloads
          - Persistent queue, background service, and auto recovery

          ### Changes
          $LOG
          NOTES

      - name: Create GitHub release with APK
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Arc Download Manager ${{ steps.meta.outputs.version }}" \
            --notes-file release_notes.md

      - name: Upload release APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arc-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
