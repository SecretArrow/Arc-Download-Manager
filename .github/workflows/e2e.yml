name: E2E (instrumented)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  instrumented-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            for f in home browser files settings add; do
              adb shell "run-as com.arc.downloadmanager cat /data/data/com.arc.downloadmanager/files/screenshots/$f.png" > "screenshots/$f.png" || true
              [ -s "screenshots/$f.png" ] || rm -f "screenshots/$f.png"
            done
            ls -la screenshots/ || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Commit screenshots to main
        if: success()
        run: |
          if [ -n "$(ls -A screenshots 2>/dev/null)" ]; then
            git config user.name "SecretArrow"
            git config user.email "SecretArrow@users.noreply.github.com"
            git add screenshots
            if git diff --cached --quiet; then
              echo "Screenshots unchanged"
            else
              git commit -m "docs: refresh app screenshots [skip ci]"
              git push
            fi
          else
            echo "No screenshots captured"
          fi

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
